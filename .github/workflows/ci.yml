name: Rust checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev pkg-config fonts-liberation xvfb xauth
      - name: Install pinned toolchain
        run: rustup show
      - name: Verify production native adapters
        run: python tools/native_features.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify hidden native modal windows
        if: runner.os != 'Linux'
        run: cargo run -p polished-map-platform --locked --example native_modals
        env:
          POLISHED_MAP_NATIVE_MODAL_PROBE: '1'
      - name: Verify isolated X11 modal windows
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum env POLISHED_MAP_NATIVE_MODAL_PROBE=1 cargo run -p polished-map-platform --locked --example native_modals
      - name: Verify native Wayland modal protocol
        if: runner.os == 'Linux'
        run: python3 tools/wayland_modal_probe.py
      - name: Verify native X11 opacity property
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test -p polished-map-platform --locked native_x11_opacity -- --ignored --test-threads=1
      - name: Verify native X11 file-drop protocol
        if: runner.os == 'Linux'
        run: timeout 90s xvfb-run --auto-servernum env WINIT_X11_SCALE_FACTOR=2 POLISHED_MAP_X11_DROP_PROBE=1 cargo test -p polished-map-platform --locked --test x11_file_drop native_x11_file_drop -- --ignored --exact --nocapture
      - name: Verify native Wayland opacity protocol
        if: runner.os == 'Linux'
        run: python3 tools/wayland_opacity_probe.py
      - name: Verify native Wayland file-drop protocol
        if: runner.os == 'Linux'
        run: python3 tools/wayland_file_drop_probe.py
      - run: cargo test -p polished-map-project --locked --lib installed_bold_faces -- --ignored --nocapture
      - run: cargo test -p polished-map-project --locked --lib installed_native_font -- --ignored --nocapture
      - run: cargo test -p polished-map-gui --locked --lib installed_native_fonts -- --ignored --nocapture
      - run: cargo test -p polished-map-cli --locked --test printing installed_print_fonts -- --ignored --nocapture
      - run: cargo doc --workspace --no-deps --locked
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev pkg-config
      - run: rustup toolchain install 1.95 --profile minimal
      - run: cargo +1.95 check --workspace --all-targets --locked
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/icon_assets.py
      - run: python3 tools/artwork_assets.py
      - run: python3 tools/vendor_sources.py
      - run: python3 tools/font_assets.py
      - run: python3 tools/help_assets.py
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable upstream source
        run: |
          git init .reference/master
          git -C .reference/master remote add origin https://github.com/Rangi42/polished-map.git
          git -C .reference/master fetch --depth 1 origin 8b9bdc2b8aac8c865809516c2123af69c498da0b
          git init .reference/fltk
          git -C .reference/fltk remote add origin https://github.com/fltk/fltk.git
          git -C .reference/fltk fetch --depth 1 origin a9b1113516ffd15fc7602a6d425a317df30f4720
      - run: python3 tools/reference_oracle.py --checkout .reference/master --output .scratch/reference-2bpp
      - run: python3 tools/lz_oracle.py --checkout .reference/master --output .scratch/reference-lz
      - run: python3 tools/asm_graphics_oracle.py --checkout .reference/master --output .scratch/reference-asm
      - run: python3 tools/png_oracle.py --checkout .reference/master --fltk-checkout .reference/fltk --output .scratch/reference-png
      - run: python3 tools/help_assets.py --reference-checkout .reference/master
      - run: python3 tools/block_brush_oracle.py --checkout .reference/master --output .scratch/reference-block
      - run: python3 tools/map_sizes_oracle.py --checkout .reference/master --output .scratch/reference-map-sizes
      - run: python3 tools/discovery_oracle.py --checkout .reference/master --output .scratch/reference-discovery
      - run: python3 tools/asset_paths_oracle.py --checkout .reference/master --output .scratch/reference-asset-paths
      - run: python3 tools/asset_sort_oracle.py --checkout .reference/fltk --output .scratch/reference-asset-sort
      - run: cargo test -p polished-map-project --locked --lib reference_asset_numeric_order -- --ignored
        env:
          POLISHED_MAP_ASSET_SORT_ORACLE: ${{ github.workspace }}/.scratch/reference-asset-sort
      - run: python3 tools/tile_editor_oracle.py --checkout .reference/master --output .scratch/reference-tile
      - run: python3 tools/palette_editor_oracle.py --checkout .reference/master --output .scratch/reference-palette
      - run: python3 tools/event_oracle.py --checkout .reference/master --output .scratch/reference-event
      - run: python3 tools/warp_id_oracle.py --checkout .reference/master --output .scratch/reference-warp-id
      - run: python3 tools/priority_oracle.py --checkout .reference/master --output .scratch/reference-priority
      - run: python3 tools/print_oracle.py --checkout .reference/master --output .scratch/reference-print
      - run: cargo test -p polished-map-project --locked --test reference -- --ignored
        env:
          POLISHED_MAP_2BPP_ORACLE: ${{ github.workspace }}/.scratch/reference-2bpp
          POLISHED_MAP_LZ_ORACLE: ${{ github.workspace }}/.scratch/reference-lz
          POLISHED_MAP_ASM_ORACLE: ${{ github.workspace }}/.scratch/reference-asm
          POLISHED_MAP_PNG_ORACLE: ${{ github.workspace }}/.scratch/reference-png
          POLISHED_MAP_BLOCK_ORACLE: ${{ github.workspace }}/.scratch/reference-block
          POLISHED_MAP_SIZES_ORACLE: ${{ github.workspace }}/.scratch/reference-map-sizes
          POLISHED_MAP_DISCOVERY_ORACLE: ${{ github.workspace }}/.scratch/reference-discovery
          POLISHED_MAP_ASSET_PATHS_ORACLE: ${{ github.workspace }}/.scratch/reference-asset-paths
          POLISHED_MAP_TILE_ORACLE: ${{ github.workspace }}/.scratch/reference-tile
          POLISHED_MAP_PALETTE_ORACLE: ${{ github.workspace }}/.scratch/reference-palette
          POLISHED_MAP_EVENT_ORACLE: ${{ github.workspace }}/.scratch/reference-event
          POLISHED_MAP_WARP_ID_ORACLE: ${{ github.workspace }}/.scratch/reference-warp-id
          POLISHED_MAP_PRIORITY_ORACLE: ${{ github.workspace }}/.scratch/reference-priority
          POLISHED_MAP_PRINT_ORACLE: ${{ github.workspace }}/.scratch/reference-print
  visuals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers pkg-config
      - name: Verify original menu drawing and palette slider behavior
        run: |
          git init .reference/master
          git -C .reference/master remote add origin https://github.com/Rangi42/polished-map.git
          git -C .reference/master fetch --depth 1 origin 8b9bdc2b8aac8c865809516c2123af69c498da0b
          python3 tools/menu_marks_oracle.py --checkout .reference/master --output .scratch/reference-menu-marks --fltk-cache .scratch/menu-fltk
          cargo test -p polished-map-gui --locked --features visual-tests --lib reference_menu_marks -- --ignored
          cargo test -p polished-map-gui --locked --features visual-tests --lib reference_slider_boxes -- --ignored
          python3 tools/slider_oracle.py --output .scratch/reference-slider --fltk-cache .scratch/menu-fltk
          cargo test -p polished-map-gui --locked --features visual-tests --lib reference_slider_drag -- --ignored
      - run: cargo test -p polished-map-gui --locked --features visual-tests -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-differences
          path: |
            crates/gui/tests/snapshots/**/*.diff.png
            crates/gui/tests/snapshots/**/*.new.png
  real-project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable pokecrystal fixture
        run: |
          git init .reference/pokecrystal
          git -C .reference/pokecrystal remote add origin https://github.com/pret/pokecrystal.git
          git -C .reference/pokecrystal fetch --depth 1 origin bd983395006298e976ae1871ef092e87f3385506
          git -C .reference/pokecrystal checkout --detach FETCH_HEAD
      - run: cargo test -p polished-map-project --locked --test real_project --test real_print -- --ignored --nocapture
        env:
          POLISHED_MAP_POKECRYSTAL: ${{ github.workspace }}/.reference/pokecrystal
