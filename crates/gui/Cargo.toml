[package]
name = "polished-map-gui"
default-run = "polished-map-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
visual-tests = ["egui_kittest/wgpu", "egui_kittest/snapshot"]
native-tests = []

[[example]]
name = "native_preferences"
required-features = ["native-tests"]

[[example]]
name = "native_image_clipboard"
required-features = ["native-tests"]

[dependencies]
polished-map-core.workspace = true
polished-map-project.workspace = true
eframe.workspace = true
egui-winit = { version = "=0.37.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
arboard.workspace = true
polished-map-platform = { version = "0.1.0", path = "../platform" }

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13"

[lints]
workspace = true
