[package]
name = "polished-map-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "objc2-core-foundation"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Drive the actual window adapter against an isolated protocol peer, without a GPU.
winit = { version = "=0.30.13", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "rwh_06"] }
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }
x11rb = "0.13"

[target.'cfg(windows)'.dev-dependencies]
# Test the exact vendored OLE callback against its original Windows ABI types.
windows-sys-legacy = { package = "windows-sys", version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tracing = "0.1"

# This small FFI boundary is intentionally separate from workspace crates that
# forbid unsafe. Only the narrow native FFI modules opt in; other code denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
