[workspace]
members = ["crates/core", "crates/project", "crates/gui", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-3.0-only"
repository = "https://github.com/vulcandth/polished-map-ng"

[workspace.dependencies]
polished-map-core = { version = "0.1.0", path = "crates/core" }
polished-map-project = { version = "0.1.0", path = "crates/project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
sha2 = "0.10"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
egui_kittest = { version = "0.37", features = ["eframe"] }
rfd = "0.17"
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
